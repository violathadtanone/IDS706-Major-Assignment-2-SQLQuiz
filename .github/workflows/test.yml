name: Verify hosted database

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify-database:
    runs-on: ubuntu-latest
    steps:
      - name: Verify students table using GitHub Secret
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          PGSSLMODE: require
          PGCONNECT_TIMEOUT: 15
        run: |
          if [ -z "$DATABASE_URL" ]; then
            echo "::error::Add the DATABASE_URL repository secret with your Supabase Session Pooler connection string."
            exit 1
          fi
          psql "$DATABASE_URL" -X -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN READ ONLY;
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM public.students) THEN
              RAISE EXCEPTION 'The students table is empty';
            END IF;
          END
          $$;
          COMMIT;
          SQL
          echo "Verified: connected to PostgreSQL and public.students contains data."
