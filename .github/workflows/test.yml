name: Quiz application checks and deployment

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quiz-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    name: Static, Edge Function, and database checks
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: postgres
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Check browser JavaScript syntax
        run: node --check app.js

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.4.1

      - name: Check Edge Function types
        run: deno check supabase/functions/quiz-api/index.ts

      - name: Test SQL safety rules
        run: deno test supabase/functions/quiz-api/index_test.ts

      # The postgres service is plain PostgreSQL, so supply the roles that
      # Supabase already provides in the deployed database.
      - name: Create Supabase roles in test database
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE anon NOLOGIN NOINHERIT;
          CREATE ROLE authenticated NOLOGIN NOINHERIT;
          CREATE ROLE service_role NOLOGIN NOINHERIT BYPASSRLS;
          GRANT USAGE ON SCHEMA public TO anon, authenticated, service_role;
          SQL

      - name: Apply dataset migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000000_school_lunch_dataset.sql

      - name: Apply quiz security migration
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f supabase/migrations/20261020000001_quiz_security.sql

      - name: Verify seeded data, restricted query role, and audit integrity
        run: |
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF (SELECT count(*) FROM public.schools) <> 20 THEN
              RAISE EXCEPTION 'Expected 20 schools';
            END IF;
            IF (SELECT count(*) FROM public.students) <> 100 THEN
              RAISE EXCEPTION 'Expected 100 students';
            END IF;
            IF (SELECT count(*) FROM public.meals) <> 411 THEN
              RAISE EXCEPTION 'Expected 411 meal transactions';
            END IF;
            IF has_table_privilege('quiz_taker', 'public.quiz_audit_log', 'INSERT')
              OR has_table_privilege('quiz_taker', 'public.quiz_audit_log', 'UPDATE')
              OR has_table_privilege('quiz_taker', 'public.quiz_audit_log', 'DELETE')
              OR has_table_privilege('quiz_taker', 'public.quiz_audit_log', 'TRUNCATE') THEN
              RAISE EXCEPTION 'quiz_taker has a forbidden audit-log privilege';
            END IF;
          END
          $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -c \
            "SET ROLE quiz_runner; BEGIN READ ONLY; SET LOCAL ROLE quiz_taker; SELECT count(*) AS readable_students FROM public.students; ROLLBACK; RESET ROLE;"
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          DECLARE
            entry_id uuid;
          BEGIN
            INSERT INTO public.quiz_audit_log (
              actor_id, action, question_id, query_text, outcome
            )
            VALUES (
              gen_random_uuid(), 'query_run', 'top-students',
              'SELECT student_id FROM students', 'success'
            )
            RETURNING id INTO entry_id;

            BEGIN
              UPDATE public.quiz_audit_log SET outcome = 'error' WHERE id = entry_id;
              RAISE EXCEPTION 'Audit-log update unexpectedly succeeded';
            EXCEPTION
              WHEN insufficient_privilege THEN NULL;
            END;

            BEGIN
              DELETE FROM public.quiz_audit_log WHERE id = entry_id;
              RAISE EXCEPTION 'Audit-log delete unexpectedly succeeded';
            EXCEPTION
              WHEN insufficient_privilege THEN NULL;
            END;
          END
          $$;
          SQL
          psql "$DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          BEGIN;
          SET LOCAL ROLE service_role;
          SELECT public.save_quiz_answer(
            '00000000-0000-0000-0000-000000000001',
            'top-students',
            'SELECT student_id FROM students',
            '[]'::jsonb
          );
          RESET ROLE;
          DO $$
          BEGIN
            IF NOT EXISTS (
              SELECT 1 FROM public.quiz_audit_log
              WHERE actor_id = '00000000-0000-0000-0000-000000000001'
                AND action = 'quiz_saved'
                AND question_id = 'top-students'
                AND outcome = 'success'
            ) THEN
              RAISE EXCEPTION 'Saving quiz progress did not append an audit record';
            END IF;
          END
          $$;
          ROLLBACK;
          SQL

  deploy:
    name: Deploy Supabase and GitHub Pages
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event_name == 'push' && github.ref == 'refs/heads/main')
    needs: checks
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.pages-deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Require deployment secrets
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then echo "::error::Missing SUPABASE_ACCESS_TOKEN"; exit 1; fi
          if [ -z "$SUPABASE_PROJECT_REF" ]; then echo "::error::Missing SUPABASE_PROJECT_REF"; exit 1; fi
          if [ -z "$SUPABASE_DB_PASSWORD" ]; then echo "::error::Missing SUPABASE_DB_PASSWORD"; exit 1; fi
          if [ -z "$SUPABASE_URL" ]; then echo "::error::Missing SUPABASE_URL"; exit 1; fi
          if [ -z "$SUPABASE_ANON_KEY" ]; then echo "::error::Missing SUPABASE_ANON_KEY"; exit 1; fi

      - name: Set up Supabase CLI
        uses: supabase/setup-cli@v1
        with:
          version: latest

      - name: Link project and apply database migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
        run: |
          supabase link --project-ref "$SUPABASE_PROJECT_REF" --password "$SUPABASE_DB_PASSWORD"
          supabase db push --linked

      - name: Require restricted query-role connection
        env:
          QUIZ_DATABASE_URL: ${{ secrets.QUIZ_DATABASE_URL }}
        run: |
          if [ -z "$QUIZ_DATABASE_URL" ]; then
            echo "::error::Database migrations were applied. Set a password for quiz_runner, add QUIZ_DATABASE_URL, then rerun this workflow."
            exit 1
          fi

      - name: Set Edge Function database connection secret
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
          QUIZ_DATABASE_URL: ${{ secrets.QUIZ_DATABASE_URL }}
        run: |
          secret_file="$RUNNER_TEMP/quiz-function-secrets.env"
          trap 'rm -f "$secret_file"' EXIT
          umask 077
          printf 'QUIZ_DATABASE_URL=%s\n' "$QUIZ_DATABASE_URL" > "$secret_file"
          supabase secrets set --project-ref "$SUPABASE_PROJECT_REF" --env-file "$secret_file"

      - name: Deploy quiz API
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_PROJECT_REF: ${{ secrets.SUPABASE_PROJECT_REF }}
        run: supabase functions deploy quiz-api --project-ref "$SUPABASE_PROJECT_REF"

      - name: Build static website with public Supabase config
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_ANON_KEY: ${{ secrets.SUPABASE_ANON_KEY }}
        run: |
          mkdir dist
          cp index.html app.js style.css dist/
          node -e 'const fs = require("node:fs"); const config = {url: process.env.SUPABASE_URL, anonKey: process.env.SUPABASE_ANON_KEY}; fs.writeFileSync("dist/supabase-config.js", `window.SUPABASE_CONFIG = ${JSON.stringify(config)};\n`);'

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      - name: Deploy GitHub Pages
        id: pages-deployment
        uses: actions/deploy-pages@v4
