<svg xmlns="http://www.w3.org/2000/svg" width="1240" height="370" viewBox="0 0 1240 370" role="img" aria-labelledby="title description">
  <title id="title">SQL Quiz database setup</title>
  <desc id="description">On your laptop, query.py uses Python and psycopg2 to connect with SSL and database credentials through the Supabase Session Pooler to hosted PostgreSQL. Supabase Dashboard / SQL Editor runs init.sql to set up the postgres database tables schools, students, and meals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0 10 5 0 10z" fill="#737373"/></marker>
    <style>
      text { font-family: Arial, Helvetica, sans-serif; fill: #222; font-size: 15px; }
      .panel { fill: #fcfcfc; stroke: #a6a6a6; stroke-width: 1.2; }
      .node { fill: #eee; stroke: #b3b3b3; stroke-width: 1.2; }
      .flow { fill: none; stroke: #737373; stroke-width: 1.2; marker-end: url(#arrow); }
    </style>
  </defs>
  <rect width="1240" height="370" fill="white"/>
  <rect x="30" y="40" width="340" height="290" class="panel"/>
  <text x="200" y="64" text-anchor="middle">Your laptop</text>
  <rect x="80" y="90" width="240" height="80" class="node"/>
  <text x="200" y="122" text-anchor="middle">query.py</text>
  <text x="200" y="147" text-anchor="middle">(Python + psycopg2)</text>
  <rect x="60" y="230" width="280" height="70" class="node"/>
  <text x="200" y="270" text-anchor="middle">Supabase Dashboard / SQL Editor</text>

  <rect x="600" y="25" width="610" height="305" class="panel"/>
  <text x="905" y="49" text-anchor="middle">Supabase (your free project)</text>
  <rect x="630" y="90" width="240" height="80" class="node"/>
  <text x="750" y="122" text-anchor="middle">Supabase Session Pooler</text>
  <text x="750" y="147" text-anchor="middle">*.pooler.supabase.com : 5432</text>

  <path d="M925 165v125c0 12.2 56 22 125 22s125-9.8 125-22V165" fill="#eee" stroke="#b3b3b3" stroke-width="1.2"/>
  <ellipse cx="1050" cy="165" rx="125" ry="22" fill="#eee" stroke="#b3b3b3" stroke-width="1.2"/>
  <text x="1050" y="214" text-anchor="middle">PostgreSQL</text>
  <text x="1050" y="242" text-anchor="middle">database: postgres</text>
  <text x="1050" y="270" text-anchor="middle">tables: schools, students, meals</text>

  <path d="M320 130H630" class="flow"/>
  <text x="475" y="119" text-anchor="middle">SSL, your credentials</text>
  <path d="M870 130C902 130 905 147 934 155" class="flow"/>
  <path d="M340 265H815C866 265 885 278 925 278" class="flow"/>
  <rect x="588" y="251" width="95" height="23" fill="white"/>
  <text x="635" y="267" text-anchor="middle">run init.sql</text>
</svg>
